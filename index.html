<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Ego AIII</title>
<style>
:root{--ink:#10203F;--mute:#5B6B8C;--line:#E1E9F7;--soft:#F5F9FF;--blue:#1F5BFF;--blue2:#0E3FD0;--green:#12B76A;--coral:#E5484D;--amber:#E8A317;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font:16px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--ink);background:#fff;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px}
.name{font-size:22px;font-weight:750;letter-spacing:-.02em;color:var(--blue2)}
.name small{display:block;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:0}
.arch{width:56px;height:72px;border-radius:28px 28px 12px 12px;overflow:hidden;position:relative;background:linear-gradient(160deg,#EAF2FF,#E4FAEF);border:1px solid var(--line);box-shadow:0 6px 20px rgba(31,91,255,.14);flex:none}
.arch svg{position:absolute;inset:0;margin:auto;width:60%;opacity:.55}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
main{padding:18px 0}
.hero{border-radius:26px;padding:20px;background:linear-gradient(135deg,#F0F6FF 0%,#E9FBF2 100%);border:1px solid var(--line)}
.hero h1{margin:0 0 4px;font-size:24px;line-height:1.25;letter-spacing:-.02em}
.hero p{margin:0;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#B9C4DA}
.dot.on{background:var(--green);box-shadow:0 0 0 0 rgba(18,183,106,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
.lang button{border:0;background:none;font:inherit;font-size:14px;color:var(--mute);padding:4px 8px;border-radius:10px}
.lang button.a{background:var(--blue);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:0 8px 28px rgba(31,91,255,.06)}
.card h2{margin:0 0 10px;font-size:17px}
.g{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--soft);border-radius:16px;padding:12px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--mute)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li small{display:block;color:var(--mute);font-size:13px}
.pill{padding:3px 10px;border-radius:999px;font-size:13px;font-weight:650;white-space:nowrap}
.LONG{background:#E3F8EE;color:#0B7A47}.SHORT{background:#FDEBEC;color:#B4232A}.WAIT{background:#EEF2F9;color:#4A5873}
.tag{background:#FFF4DC;color:#8A5A00}
.warn{font-size:13px;color:var(--mute);margin-top:10px}
.demo{margin-top:14px;padding:10px 14px;border-radius:14px;background:#FFF4DC;color:#7A5200;font-size:14px}
.err{margin-top:14px;padding:10px 14px;border-radius:14px;background:#FDEBEC;color:#B4232A;font-size:14px;word-break:break-word}
.sk{height:64px;border-radius:16px;background:linear-gradient(90deg,#EEF3FB 25%,#F8FAFE 50%,#EEF3FB 75%);background-size:200% 100%;animation:sh 1.4s infinite;margin-top:12px}
@keyframes sh{to{background-position:-200% 0}}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:46vh;overflow:auto;padding:4px}
.b{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.b.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.b.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:6px}
.ty span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--blue);animation:bn 1s infinite}
.ty span:nth-child(2){animation-delay:.15s;background:#2A8FD8}.ty span:nth-child(3){animation-delay:.3s;background:var(--green)}
@keyframes bn{50%{transform:translateY(-5px);opacity:.5}}
.inp{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=password],input[type=url]{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);min-height:48px}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{font:inherit;font-weight:650;border:0;border-radius:14px;padding:12px 18px;min-height:48px;background:linear-gradient(135deg,var(--blue),#1A86E0 60%,var(--green));color:#fff}
.btn.o{background:#fff;color:var(--blue2);border:1px solid var(--line)}
.q{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.q button{font:inherit;font-size:14px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--ink);min-height:40px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 5px}
.tool{display:flex;gap:12px;align-items:center}
.tool i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--soft);flex:none}
.tool svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.st{margin-left:auto;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.live{background:#E3F8EE;color:#0B7A47}.st.needs{background:#FFF4DC;color:#8A5A00}.st.nb{background:#EEF2F9;color:#4A5873}
#strip .chip{font-size:14px;cursor:pointer}.sheet{position:fixed;inset:0;z-index:50;background:rgba(16,32,63,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.kv div{background:var(--soft);border-radius:14px;padding:10px 12px}.kv b{display:block;font-size:16px}.kv span{font-size:12px;color:var(--mute)}.big{font-size:26px;padding:6px 18px}.q button.a{background:var(--blue);color:#fff;border-color:var(--blue)}.sheet ul{margin:8px 0 0;padding-left:20px}.sheet li{margin:4px 0}.px{transition:color .3s}.px.up{color:#0B7A47}.px.dn{color:#B4232A}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:56px;border-radius:14px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.a{color:var(--blue);background:var(--soft);font-weight:650}
@media(min-width:900px){body{padding-bottom:0;padding-left:210px}
nav{right:auto;top:0;width:210px;flex-direction:column;justify-content:flex-start;padding:100px 12px 12px;border-top:0;border-right:1px solid var(--line);gap:4px}
nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;justify-content:flex-start;min-height:48px}
header{position:fixed;left:210px;right:0;top:0}main{padding-top:104px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="brand">
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5BFF"/><stop offset="1" stop-color="#12B76A"/></linearGradient></defs><circle cx="20" cy="20" r="16" fill="none" stroke="url(#g)" stroke-width="5"/><circle cx="20" cy="20" r="5.5" fill="url(#g)"/></svg>
  <div class="name">Ego AIII<small id="tag"></small></div>
 </div>
 <div class="arch" aria-label="Portrait">
  <svg viewBox="0 0 24 24" fill="none" stroke="#1F5BFF" stroke-width="1.2" stroke-linecap="round"><path d="M12 5c1.5 2 1.5 5 0 7-1.5-2-1.5-5 0-7zM12 12c-3-.5-5-2.5-5.5-5 2.5.2 4.500 1.200 5.500 3M12 12c3-.5 5-2.5 5.500-5-2.500.2-4.500 1.200-5.500 3M7 14c2 0 4 1 5 3 1-2 3-3 5-3M5 17c2.500.5 5 2 7 4 2-2 4.500-3.500 7-4"/></svg>
  <!-- Place your own portrait file named sai-baba.jpg next to this page. If missing, the lotus shows. -->
  <img src="sai-baba.jpg" alt="" onerror="this.remove()">
 </div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<nav id="nav"></nav>
<script>
const T={
en:{home:'Home',trade:'Trading',chat:'Chat',tools:'Tools',settings:'Settings',tag:'Calm, careful market intelligence',hello:'Welcome to Ego AIII',sub:'Your calm, careful market assistant.',aiOn:'AI engine live',aiOff:'AI engine not connected',auto:'Automation',on:'On',off:'Off',lastScan:'Last scan',paper:'Paper trading',equity:'Virtual balance',ret:'Return',win:'Win rate',open:'Open paper trades',topShort:'Top SHORT candidates',topLong:'Top LONG candidates',waitN:'coins on WAIT',none:'Nothing right now. WAIT is a valid answer.',sig:'Signal history',entry:'Entry',sl:'Stop-loss',exp:'Expires',dis:'DISAGREEMENT',agree:'Agreement',ph:'Ask Ego AIII anything…',send:'Send',recent:'Recent questions',quick:'Quick starts',q1:'Explain RSI in simple words',q2:'What does DISAGREEMENT mean?',q3:'Explain risk per trade',needChat:'Chat is not connected yet. It needs the ai-chat backend function, which is not deployed.',tl:'AI tools',live:'Live',needs:'Needs backend',nb:'Not built yet',tChat:'AI chat',tSmart:'Smart answers',tImg:'Image generation',tDoc:'Document analysis',tCode:'Code assistant',tTrade:'Trading analysis',url:'Supabase project URL',anon:'Public API key (anon or publishable)',pin:'Dashboard PIN',save:'Save',test:'Test connection',lang:'Language',chatOn:'My ai-chat function is deployed',demo:'DEMO: sample data, not real. Add your connection in Settings.',warn:'Paper results only. Not financial advice.',err:'Could not load data:',ok:'Connected',saved:'Saved',markets:'Markets',mSearch:'Search coin, e.g. BTC',mLive:'Live from Binance',mConn:'Connecting to Binance…',mErr:'Binance data not reachable on this network',mNote:'Tap any coin to analyze it. Prices stream straight from Binance public data to your phone. No API key is used. Display only, not advice.'}
};
const IC={markets:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',trade:'<path d="M3 17l5-5 4 4 8-9M15 7h5v5"/>',chat:'<path d="M21 12a8 8 0 0 1-11.600 7.100L4 20l1-4.500A8 8 0 1 1 21 12z"/>',tools:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ls(k,d){try{const v=localStorage.getItem('ego_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem('ego_'+k,JSON.stringify(v))}catch(e){}}
const S={lang:'en',tab:'home',cfg:ls('cfg',{}),data:null,err:null,loading:true,demo:false,chat:ls('chat',[]),typing:false,msg:''};
const t=k=>(T[S.lang][k]!=null?T[S.lang][k]:T.en[k]||k);
const fp=n=>{if(n==null||n==='')return'–';n=Number(n);return n>=100?n.toFixed(2):n>=1?n.toFixed(4):n.toPrecision(4)};
const ago=i=>{if(!i)return'–';const m=Math.round((Date.now()-new Date(i))/60000);return m<1?'<1 min':m<90?m+' min':Math.round(m/60)+' h'};
const ago2=i=>{if(!i)return'–';const m=Math.round((new Date(i)-Date.now())/60000);return m<=0?'expired':m+' min'};
const dt=i=>{if(!i)return'–';const d=new Date(i);return isNaN(d)?'–':d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})};
const dur=(a,b)=>{const m=Math.round((new Date(b)-new Date(a))/60000);return !isFinite(m)?'–':m<60?m+' min':m<1440?(m/60).toFixed(1)+' h':(m/1440).toFixed(1)+' d'};
const now=Date.now();
const DEMO={status:{automation_enabled:true,last_scan:new Date(now-12*6e4).toISOString()},
scan:[{symbol:'SAMPLE1USDT',rule_decision:'SHORT',short_score:5,long_score:0,adx:25,price:0.2171,change_pct_24h:-3.4},{symbol:'SAMPLE2USDT',rule_decision:'SHORT',short_score:4,long_score:1,adx:22,price:1.083,change_pct_24h:-2.1},{symbol:'SAMPLE3USDT',rule_decision:'WAIT',short_score:2,long_score:2,adx:14,price:64.2,change_pct_24h:0.4}],
signals:[{symbol:'SAMPLE1USDT',direction:'SHORT',combined_decision:'SHORT',rule_decision:'SHORT',gemini_decision:'SHORT',entry:0.2171,stop_loss:0.22257,tp2:0.2061,risk_reward:2,disagreement:false,agreement_score:100,expires_at:new Date(now+40*6e4).toISOString()},{symbol:'SAMPLE2USDT',direction:'WAIT',combined_decision:'WAIT',rule_decision:'SHORT',gemini_decision:'WAIT',disagreement:true,agreement_score:50,expires_at:new Date(now-10*6e4).toISOString()}],
paper:{equity:1004.2,return_pct:0.42,win_rate_pct:null,closed_count:0,open_trades:[{symbol:'SAMPLE1USDT',direction:'SHORT',entry:0.2178,price:0.2169,unrealized_pnl:1.9}],warning:'Fewer than 30 closed trades: results are NOT statistically meaningful.'}};
function ico(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>'}
function pill(d){return '<span class="pill '+esc(d||'WAIT')+'">'+esc(d||'WAIT')+'</span>'}
function cand(rows,key,sc){return rows.length?rows.map(r=>'<div class="li"><div><b>'+esc(r.symbol)+'</b><small>'+sc+' '+r[key]+'/5 · ADX '+Math.round(r.adx)+' · '+fp(r.price)+' · '+(Number(r.change_pct_24h)>0?'+':'')+Number(r.change_pct_24h).toFixed(1)+'%</small></div>'+pill(r.rule_decision)+'</div>').join(''):'<p class="warn">'+t('none')+'</p>'}
function sk(){return '<div class="sk"></div><div class="sk"></div><div class="sk"></div>'}
function banner(){return (S.demo?'<div class="demo">'+t('demo')+'</div>':'')+(S.err?'<div class="err">'+t('err')+' '+esc(S.err)+'</div>':'')}
function vHome(){
 const d=S.data,live=!S.demo&&!S.err&&d;
 let h='<section class="hero"><h1>'+t('hello')+'</h1><p>'+t('sub')+'</p><div class="row"><span class="chip"><i class="dot '+(live?'on':'')+'"></i>'+(live?t('aiOn'):t('aiOff'))+'</span>';
 if(d&&d.status)h+='<span class="chip">'+t('auto')+': <b>'+(d.status.automation_enabled?t('on'):t('off'))+'</b></span><span class="chip">'+t('lastScan')+': '+ago(d.status.last_scan)+' ('+dt(d.status.last_scan)+')</span>';
 h+='<span class="chip" id="clk"></span></div></section><div id="strip" class="row" style="margin-top:14px"></div>'+banner();
 if(S.loading&&!d)return h+sk();
 if(!d)return h;
 const p=d.paper||{},sc=d.scan||[];
 h+='<div class="card"><h2>'+t('paper')+'</h2><div class="stats"><div class="stat"><b>'+fp(p.equity)+'</b><span>'+t('equity')+'</span></div><div class="stat"><b>'+(p.return_pct==null?'–':p.return_pct+'%')+'</b><span>'+t('ret')+'</span></div><div class="stat"><b>'+(p.win_rate_pct==null?'–':p.win_rate_pct+'%')+'</b><span>'+t('win')+' ('+(p.closed_count||0)+')</span></div></div>'+(p.warning?'<p class="warn">'+esc(p.warning)+'</p>':'')+'</div>';
 h+='<div class="g g2"><div class="card"><h2>'+t('topShort')+'</h2>'+cand(sc.filter(r=>r.rule_decision==='SHORT'),'short_score','SHORT')+'</div><div class="card"><h2>'+t('topLong')+'</h2>'+cand(sc.filter(r=>r.rule_decision==='LONG'),'long_score','LONG')+'</div></div>';
 h+='<p class="warn">'+sc.filter(r=>r.rule_decision==='WAIT').length+' '+t('waitN')+'</p>';
 const o=p.open_trades||[];
 h+='<div class="card"><h2>'+t('open')+'</h2>'+(o.length?o.map(x=>'<div class="li"><div><b>'+esc(x.symbol)+'</b><small>'+t('entry')+' '+fp(x.entry)+' · '+fp(x.price)+'</small><small>Opened '+dt(x.opened_at)+'</small></div><div style="text-align:right">'+pill(x.direction)+'<small style="color:'+(Number(x.unrealized_pnl)>=0?'#0B7A47':'#B4232A')+'">'+(x.unrealized_pnl==null?'–':(x.unrealized_pnl>0?'+':'')+x.unrealized_pnl)+'</small></div></div>').join(''):'<p class="warn">'+t('none')+'</p>')+'</div><p class="warn">'+t('warn')+'</p>';
 return h}
function vTrade(){
 const d=S.data;let h=banner();
 if(S.loading&&!d)return h+sk();
 const s=(d&&d.signals)||[];
 const P=(d&&d.paper)||{},O=P.open_trades||[],C=P.closed_trades||[];
 h+='<div class="card"><h2>Open paper trades</h2>'+(O.length?O.map(x=>'<div class="li" style="align-items:flex-start"><div><b>'+esc(x.symbol)+'</b><small>Entry '+fp(x.entry)+' · SL '+fp(x.stop_loss)+' · TP2 '+fp(x.tp2)+'</small><small>Opened '+dt(x.opened_at)+'</small></div><div style="text-align:right">'+pill(x.direction)+'<small style="color:'+(Number(x.unrealized_pnl)>=0?'#0B7A47':'#B4232A')+'">'+(x.unrealized_pnl==null?'–':(x.unrealized_pnl>0?'+':'')+x.unrealized_pnl)+'</small></div></div>').join(''):'<p class="warn">'+t('none')+'</p>')+'</div>';
 h+='<div class="card"><h2>Closed paper trades</h2>'+(C.length?C.map(x=>{const pn=Number(x.pnl);return '<div class="li" style="align-items:flex-start"><div><b>'+esc(x.symbol)+'</b> '+pill(x.direction)+'<small>'+fp(x.entry)+' → '+fp(x.exit_price)+' · '+esc(x.exit_reason||'–')+'</small><small>'+dt(x.opened_at)+' → '+dt(x.closed_at)+' ('+dur(x.opened_at,x.closed_at)+')</small></div><div style="text-align:right"><b style="color:'+(pn>=0?'#0B7A47':'#B4232A')+'">'+(pn>0?'+':'')+pn.toFixed(2)+'</b><small>'+(x.r_multiple==null?'':x.r_multiple+'R')+'</small></div></div>'}).join(''):'<p class="warn">No closed trades yet.</p>')+'</div>';
 h+='<div class="card"><h2>'+t('sig')+'</h2>'+(s.length?s.map(x=>{const dec=x.combined_decision||x.direction;return '<div class="li" style="align-items:flex-start"><div><b>'+esc(x.symbol)+'</b> '+(x.disagreement?'<span class="pill tag">'+t('dis')+'</span>':'')+'<small>Rule '+esc(x.rule_decision||'–')+' · Gemini '+esc(x.gemini_decision||'–')+' · '+t('agree')+' '+(x.agreement_score==null?'–':x.agreement_score+'%')+'</small>'+(dec==='LONG'||dec==='SHORT'?'<small>'+t('entry')+' '+fp(x.entry)+' · '+t('sl')+' '+fp(x.stop_loss)+' · TP2 '+fp(x.tp2)+' · R:R '+(x.risk_reward||'–')+'</small>':'')+'<small>'+t('exp')+': '+ago2(x.expires_at)+'</small><small>Created '+dt(x.created_at)+'</small></div>'+pill(dec)+'</div>'}).join(''):'<p class="warn">'+t('none')+'</p>')+'</div><p class="warn">'+t('warn')+'</p>';
 return h}
function vChat(){
 const m=S.chat.map(x=>'<div class="b '+x.r+'">'+esc(x.m)+'</div>').join('')+(S.typing?'<div class="b a ty"><span></span><span></span><span></span></div>':'');
 const rec=S.chat.filter(x=>x.r==='u').slice(-4).reverse();
 return '<div class="card"><h2>'+t('chat')+'</h2><div class="msgs" id="msgs">'+(m||'<p class="warn">'+t('needChat')+'</p>')+'</div><div class="inp"><input type="text" id="msg" placeholder="'+esc(t('ph'))+'" onkeydown="if(event.key===\'Enter\')send()"><button class="btn" onclick="send()">'+t('send')+'</button></div>'+
 '<div class="q"><span class="warn" style="margin:0;align-self:center">'+t('quick')+':</span>'+['q1','q2','q3'].map(k=>'<button onclick="ask(\''+k+'\')">'+t(k)+'</button>').join('')+'</div></div>'+
 (rec.length?'<div class="card"><h2>'+t('recent')+'</h2>'+rec.map(x=>'<div class="li"><span>'+esc(x.m.slice(0,70))+'</span></div>').join('')+'</div>':'')}
function vTools(){
 const L=[['tTrade','trade','live'],['tChat','chat','needs'],['tSmart','chat','needs'],['tCode','tools','needs'],['tImg','tools','nb'],['tDoc','tools','nb']];
 return '<div class="card"><h2>'+t('tl')+'</h2>'+L.map(x=>'<div class="li"><div class="tool"><i>'+ico(x[1])+'</i><b>'+t(x[0])+'</b></div><span class="st '+x[2]+'">'+t(x[2]==='nb'?'nb':x[2])+'</span></div>').join('')+'</div>'}
function vSet(){
 const c=S.cfg;
 return '<div class="card"><h2>'+t('settings')+'</h2><label>'+t('url')+'</label><input type="url" id="cu" placeholder="https://xxxx.supabase.co" value="'+esc(c.url||'')+'"><label>'+t('anon')+'</label><input type="password" id="ca" value="'+esc(c.anon||'')+'"><label>'+t('pin')+'</label><input type="password" id="cp" value="'+esc(c.pin||'')+'"><label style="display:flex;gap:10px;align-items:center;color:var(--ink)"><input type="checkbox" id="cc" '+(c.chatOn?'checked':'')+' style="width:22px;height:22px"> '+t('chatOn')+'</label><div class="row"><button class="btn" onclick="saveCfg()">'+t('save')+'</button><button class="btn o" onclick="saveCfg(true)">'+t('test')+'</button></div><p class="warn" id="cs"></p></div>'}
function render(){
 $('#tag').textContent=t('tag');document.documentElement.lang=S.lang;
 $('#nav').innerHTML=['home','markets','trade','chat','tools','settings'].map(k=>'<button class="'+(S.tab===k?'a':'')+'" onclick="go(\''+k+'\')">'+ico(k)+'<span>'+t(k)+'</span></button>').join('');
 const V={home:vHome,markets:vMarkets,trade:vTrade,chat:vChat,tools:vTools,settings:vSet};
 $('#app').innerHTML=V[S.tab]();updLive();
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
function go(k){S.tab=k;render();window.scrollTo(0,0)}
async function load(){
 const c=S.cfg;
 if(!c.url||!c.anon||!c.pin){S.data=DEMO;S.demo=true;S.err=null;S.loading=false;render();return}
 S.demo=false;
 try{const r=await fetch(base()+'/functions/v1/dashboard-data',{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anon,Authorization:'Bearer '+c.anon,'x-dashboard-pin':c.pin},body:JSON.stringify({interval:'15m'})});
  const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||j.message||('HTTP '+r.status));S.data=j;S.err=null}
 catch(e){S.err=String(e.message||e)}
 S.loading=false;render()}
function saveCfg(test){
 S.cfg={url:$('#cu').value.trim(),anon:$('#ca').value.trim(),pin:$('#cp').value,chatOn:$('#cc').checked};sv('cfg',S.cfg);
 $('#cs').textContent=t('saved');
 if(test){S.loading=true;load().then(()=>{$('#cs').textContent=S.err?(t('err')+' '+S.err):t('ok')})}
 else load()}
function ask(k){$('#msg').value=t(k);send()}
async function send(){
 const i=$('#msg');const m=i.value.trim();if(!m)return;
 S.chat.push({r:'u',m});S.typing=true;render();
 const c=S.cfg;let reply;
 if(c.chatOn&&c.url&&c.anon&&c.pin){
  try{const r=await fetch(base()+'/functions/v1/ai-chat',{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anon,Authorization:'Bearer '+c.anon,'x-dashboard-pin':c.pin},body:JSON.stringify({message:m,lang:S.lang})});
   const j=await r.json();reply=j.reply||j.error||j.message||'No reply'}
  catch(e){reply=t('err')+' '+e.message}
 }else reply=t('needChat');
 S.typing=false;S.chat.push({r:'a',m:reply});sv('chat',S.chat.slice(-40));render()}

const base=()=>{try{return new URL(S.cfg.url).origin}catch(e){return(S.cfg.url||'').replace(/\/$/,'')}};
const IVS=['5m','15m','30m','1h','4h','1d'];S.an=null;
function openAn(sym){S.an={sym,iv:(S.an&&S.an.iv)||'15m',loading:false,res:null,err:null};drawAn()}
function closeAn(){S.an=null;const x=$('#sheet');if(x)x.remove()}
function setIv(v){S.an.iv=v;S.an.res=null;S.an.err=null;drawAn()}
function drawAn(){let sh=$('#sheet');if(!sh){sh=document.createElement('div');sh.id='sheet';sh.className='sheet';sh.onclick=e=>{if(e.target===sh)closeAn()};document.body.appendChild(sh)}sh.innerHTML='<div>'+vAn()+'</div>';updLive()}
async function runAn(){const c=S.cfg,a=S.an;if(!(c.url&&c.anon&&c.pin)){a.err='Connect your Supabase details in Settings first.';drawAn();return}
 a.loading=true;a.err=null;a.res=null;drawAn();
 try{const H={'Content-Type':'application/json',apikey:c.anon,Authorization:'Bearer '+c.anon,'x-dashboard-pin':c.pin};
  const go=async ph=>{const r=await fetch(base()+'/functions/v1/analyze-coin',{method:'POST',headers:H,body:JSON.stringify({symbol:a.sym,interval:a.iv,phase:ph})});let j;try{j=await r.json()}catch(e){throw new Error('HTTP '+r.status+(r.status===504?' (timeout)':''))}if(!r.ok||!j.ok)throw new Error((j.error||j.message||('HTTP '+r.status))+(j.timings?' '+JSON.stringify(j.timings):''));return j};
  a.step='Step 1 of 2: candles and indicators…';drawAn();await go('prepare');
  a.step='Step 2 of 2: AI analysis and decision…';drawAn();a.res=await go('analyze')}catch(e){a.err=String(e.message||e)}
 a.loading=false;if(S.an===a)drawAn()}
function vAn(){const a=S.an;
 let h='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">'+esc(a.sym.replace('USDT',''))+' <small style="font-size:14px;color:var(--mute)">USDT</small> <span id="shp" class="px"></span></h2><button class="btn o" onclick="closeAn()" style="min-height:40px;padding:6px 16px">&#10005;</button></div>';
 h+='<div class="q">'+IVS.map(v=>'<button class="'+(a.iv===v?'a':'')+'" onclick="setIv(\''+v+'\')">'+v+'</button>').join('')+'</div>';
 h+='<div class="row"><button class="btn" onclick="runAn()" '+(a.loading?'disabled':'')+'>Analyze now</button></div>';
 if(a.loading)h+='<div class="b a ty" style="margin-top:14px;display:inline-block"><span></span><span></span><span></span></div><p class="warn">'+esc(a.step||'Starting…')+' This can take up to a minute.</p>';
 if(a.err)h+='<div class="err">'+esc(a.err)+'</div>';
 if(a.res)h+=vRes(a.res);
 return h}
function vRes(r){const d=r.decision,k=(x,y)=>'<div><span>'+x+'</span><b>'+y+'</b></div>',I=r.indicators||{},E=I.ema||{},A=I.adx||{},M=I.macd_hist;
 let h='<div class="row" style="align-items:center;margin-top:16px"><span class="pill big '+esc(d)+'">'+esc(d)+'</span>'+(r.disagreement?'<span class="pill tag">DISAGREEMENT</span>':'')+(r.cached?'<span class="chip">recent result</span>':'')+'</div>';
 h+='<p class="warn">Rule engine: <b>'+esc(r.rule||'–')+'</b> &middot; Gemini: <b>'+esc(r.gemini||'n/a')+'</b> &middot; Agreement '+(r.agreement_score==null?'–':r.agreement_score+'%')+' &middot; '+esc(r.interval)+'</p>';
 if(r.ai_error)h+='<div class="demo">AI engine unavailable ('+esc(r.ai_error)+'). Only the rule engine was used, so the result is WAIT by design.</div>';
 if(d==='LONG'||d==='SHORT')h+='<div class="kv">'+k('Entry',fp(r.entry))+k('Stop-loss',fp(r.stop_loss))+k('TP1',fp(r.tp1))+k('TP2',fp(r.tp2))+k('TP3',fp(r.tp3))+k('Risk : Reward','1 : '+(r.risk_reward||'–'))+k('Leverage cap',(r.leverage||'–')+'x')+k('Valid for',ago2(r.expires_at))+'</div><p class="warn">Entry is the price at the last closed candle. If the live price has moved far from it, the setup may no longer be valid.</p>';
 else h+='<div class="demo" style="background:#EEF2F9;color:#33415C">No trade setup right now. WAIT means the evidence is mixed or the risk:reward is poor. Not entering is a valid decision.</div>';
 if((r.reasons||[]).length)h+='<h2 style="margin-top:16px">Why</h2><ul>'+r.reasons.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
 if(r.bullish)h+='<h2 style="margin-top:16px">Bullish case</h2><p style="margin:4px 0">'+esc(r.bullish)+'</p>';
 if(r.bearish)h+='<h2 style="margin-top:16px">Bearish case</h2><p style="margin:4px 0">'+esc(r.bearish)+'</p>';
 if(r.safety_note)h+='<p class="warn">Safety check: '+esc(r.safety_note)+'</p>';
 h+='<h2 style="margin-top:16px">Indicators</h2><div class="kv">'+k('Price now',fp(r.price_now))+k('RSI 14',I.rsi14==null?'–':Number(I.rsi14).toFixed(1))+k('ADX 14',A.adx==null?'–':Number(A.adx).toFixed(1))+k('MACD hist',M==null?'–':fp(M))+k('EMA 20 / 50',fp(E.e20)+' / '+fp(E.e50))+k('EMA 200',fp(E.e200))+k('ATR 14',fp(I.atr14))+k('Support / Resistance',fp(I.support_50)+' / '+fp(I.resistance_50))+'</div>';
 h+='<p class="warn">Analysis only, not financial advice. Futures with leverage can lose your whole margin. Paper-test before risking money.</p>';
 return h}
const L={map:{},st:'connecting',ts:0,poll:null};
const fm=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':n.toFixed(0);
function put(s,p,o,q){if(!/USDT$/.test(s)||!isFinite(p))return;const pv=L.map[s];L.map[s]={p,chg:o?(p-o)/o*100:0,q:q||0,d:pv?(p>pv.p?1:p<pv.p?-1:pv.d):0}}
function stopPoll(){if(L.poll){clearInterval(L.poll);L.poll=null}}
function startPoll(){if(L.poll)return;const go=async()=>{try{const r=await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');const a=await r.json();for(const x of a)put(x.symbol,+x.lastPrice,+x.openPrice,+x.quoteVolume);L.ts=Date.now();L.st='live'}catch(e){L.st='error'}};go();L.poll=setInterval(go,5000)}
function startLive(){
 try{
  const ws=new WebSocket('wss://fstream.binance.com/ws/!miniTicker@arr');
  const guard=setTimeout(()=>{if(!L.ts)startPoll()},6000);
  ws.onopen=()=>{};
  ws.onmessage=e=>{try{for(const x of JSON.parse(e.data))put(x.s,+x.c,+x.o,+x.q);L.ts=Date.now();L.st='live';stopPoll()}catch(_){}};
  ws.onclose=()=>{clearTimeout(guard);if(L.st==='live')L.st='reconnecting';setTimeout(startLive,3000)};
  ws.onerror=()=>{try{ws.close()}catch(_){}};
 }catch(e){startPoll()}
}
setInterval(()=>{if(L.ts&&Date.now()-L.ts>15000){L.st='reconnecting';startPoll()}},5000);
function vMarkets(){return '<div class="card"><h2>'+t('markets')+' <span id="lst" class="chip" style="font-size:13px;padding:4px 10px"></span></h2><input type="text" id="mq" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="'+esc(t('mSearch'))+'" oninput="S.mq=this.value;updLive()" value="'+esc(S.mq||'')+'"><div class="q"><button class="'+(S.mt!=='all'?'a':'')+'" onclick="setMt(\'top\')">Top 28</button><button class="'+(S.mt==='all'?'a':'')+'" onclick="setMt(\'all\')">All coins</button></div><div id="mlist"></div><p class="warn" id="msrc"></p><p class="warn">'+t('mNote')+'</p></div>'}
const pc=x=>'<small style="color:'+(x.chg>=0?'#0B7A47':'#B4232A')+'">'+(x.chg>=0?'+':'')+x.chg.toFixed(2)+'%</small>';
function updLive(){
 const ck=$('#clk');if(ck)ck.textContent=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 const st=$('#lst');if(st)st.innerHTML='<i class="dot '+(L.st==='live'?'on':'')+'"></i>'+(L.st==='live'?t('mLive'):L.st==='error'?t('mErr'):t('mConn'))+(L.ts?' · '+new Date(L.ts).toLocaleTimeString('en-GB'):'');
 const ms=$('#msrc');if(ms)ms.textContent=S.mt==='all'?'All Binance USDT futures coins, sorted by 24h volume.':(CG&&CG.l?'Top 28 by market cap (CoinGecko ranking; only coins that have Binance USDT futures).':'Top 28 large-cap coins (preset list, because the live market-cap ranking is unavailable). Times use your phone time zone.');
 const sp=$('#strip');if(sp)sp.innerHTML=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT'].map(s=>{const x=L.map[s];return '<span class="chip" onclick="openAn(\''+s+'\')"><b>'+s.replace('USDT','')+'</b> '+(x?'<span class="px '+(x.d>0?'up':x.d<0?'dn':'')+'">'+fp(x.p)+'</span> '+pc(x):'…')+'</span>'}).join('');
 const shp=$('#shp');if(shp&&S.an){const x=L.map[S.an.sym];shp.innerHTML=x?fp(x.p)+' '+pc(x):''}
 const ml=$('#mlist');if(ml){const q=(S.mq||'').trim().toUpperCase();const rk=S.mt!=='all'&&!q;const a=rk?topList().map(s=>[s,L.map[s]]):Object.entries(L.map).filter(e=>!q||e[0].includes(q)).sort((x,y)=>y[1].q-x[1].q).slice(0,q?60:40);
  ml.innerHTML=a.length?a.map((e,i)=>{const s=e[0],x=e[1];return '<div class="li" onclick="openAn(\''+s+'\')" style="cursor:pointer"><div><b>'+(rk?'<span style="color:var(--mute);font-weight:500;font-size:13px">#'+(i+1)+'</span> ':'')+esc(s.replace('USDT',''))+'</b><small>Vol '+fm(x.q)+'</small></div><div style="text-align:right"><span class="px '+(x.d>0?'up':x.d<0?'dn':'')+'"><b>'+fp(x.p)+'</b></span>'+pc(x)+'</div></div>'}).join(''):'<p class="warn">'+(L.st==='live'?t('none'):t('mConn'))+'</p>'}
}
const PRESET=['BTC','ETH','XRP','BNB','SOL','TRX','DOGE','ADA','HYPE','LINK','XLM','BCH','AVAX','SUI','LTC','TON','HBAR','DOT','UNI','AAVE','NEAR','ETC','ICP','APT','ONDO','TAO','ARB','FIL'];
const BAD=new Set(['USDT','USDC','DAI','FDUSD','USDE','TUSD','USDS','PYUSD','USD1','BUSD','USDD','GUSD','WBTC','WETH','STETH','WSTETH','WEETH','WBETH','CBBTC','BSC-USD']);
let CG=ls('top',null);S.mt='top';
function setMt(v){S.mt=v;render()}
function topList(){const src=(CG&&CG.l)||PRESET,out=[];for(const b of src){if(BAD.has(b))continue;const s=b+'USDT';if(L.map[s]&&out.indexOf(s)<0)out.push(s);if(out.length>=28)break}return out}
async function loadCG(){if(CG&&Date.now()-CG.t<36e5)return;try{const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false');if(!r.ok)return;const a=await r.json();if(!Array.isArray(a)||a.length<20)return;CG={t:Date.now(),l:a.map(x=>String(x.symbol).toUpperCase())};sv('top',CG)}catch(e){}}
loadCG();setInterval(loadCG,36e5);
setInterval(updLive,1000);
render();load();startLive();
setInterval(()=>{if(!S.demo&&(S.tab==='home'||S.tab==='trade'))load()},60000);
</script>
